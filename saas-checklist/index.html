<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>SaaS Daily — Check-list quotidienne</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SaaS Daily" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo">✓</span>
        <div>
          <h1>SaaS Daily</h1>
          <p class="tagline">Construire Sidian, un jour à la fois</p>
        </div>
      </div>
      <div class="streak" id="streak" title="Jours d'affilée avec au moins une tâche faite">
        <span class="flame">🔥</span><span id="streakCount">0</span>
      </div>
    </header>

    <section class="phasebar">
      <div class="phase-row">
        <label for="phaseSelect">Mon palier&nbsp;:</label>
        <select id="phaseSelect" aria-label="Palier de croissance"></select>
      </div>
      <p class="phase-goal" id="phaseGoal">—</p>
      <p class="phase-done" id="phaseDone">—</p>
    </section>

    <section class="datebar">
      <button class="nav" id="prevDay" aria-label="Jour précédent">‹</button>
      <div class="dateinfo">
        <button class="today-btn" id="todayBtn">Aujourd'hui</button>
        <div class="date-label" id="dateLabel">—</div>
      </div>
      <button class="nav" id="nextDay" aria-label="Jour suivant">›</button>
    </section>

    <section class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text"><span id="progressText">0 / 0</span> tâches accomplies</div>
    </section>

    <main id="list" class="list"></main>

    <section class="add-custom">
      <form id="customForm">
        <select id="customCat" aria-label="Catégorie"></select>
        <input id="customInput" type="text" placeholder="Ajouter une tâche perso…" maxlength="140" />
        <button type="submit" aria-label="Ajouter">＋</button>
      </form>
    </section>

    <footer class="foot">
      <button id="installBtn" class="ghost" hidden>📲 Installer l'app</button>
      <p class="hint">100&nbsp;% local — tes données restent sur ton téléphone.</p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./tasks.js"></script>
  <script src="./app.js"></script>
</body>
</html>
