<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>SaaS Daily — Check-list quotidienne</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SaaS Daily" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="page-head">
      <span class="page-icon">✅</span>
      <div class="page-titles">
        <h1 id="title">Aujourd'hui</h1>
        <p class="tagline" id="dateLabel">—</p>
      </div>
      <div class="daynav">
        <button class="nav" id="editStage" aria-label="Mon avancement" title="Indiquer mon avancement">📋</button>
      </div>
    </header>

    <section id="setup" class="setup" hidden></section>

    <main id="list" class="list"></main>
  </div>

  <footer class="foot">
    <button id="installBtn" class="ghost" hidden>📲 Installer l'app</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./tasks.js"></script>
  <script src="./app.js"></script>
</body>
</html>
